# Build the backend image and push it to Amazon ECR.
#
# Runs only when backend/ changed (or this file did) — see `paths` below. The
# frontend has its own workflow so the two services version independently.
#
# Required repository configuration (Settings -> Secrets and variables ->
# Actions):
#   secrets.AWS_ACCESS_KEY_ID       IAM user scoped to ECR push
#   secrets.AWS_SECRET_ACCESS_KEY
#   vars.AWS_REGION                 e.g. ap-southeast-2
#   vars.ECR_BACKEND_REPOSITORY     e.g. madhats-backend (must already exist —
#                                   ECR does NOT create a repository on push)
#
# The registry host comes from the ecr-login step's output, so the AWS account
# ID is never stored in this repository.

name: Backend image → ECR

on:
  push:
    branches: ["master"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-image.yml"
  # Rebuild without a code change (e.g. after rotating credentials).
  workflow_dispatch:

concurrency:
  # Two pushes in quick succession would race to move :latest. Cancel the older
  # one; its :<sha> tag is not worth the minutes.
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}:latest
          # Scoped per service so the frontend's cache cannot evict this one.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Summary
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_BACKEND_REPOSITORY }}"
          {
            echo "### Backend image pushed"
            echo ""
            echo '```'
            echo "$IMAGE:${{ github.sha }}"
            echo "$IMAGE:latest"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
