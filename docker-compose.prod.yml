# Production stack — self-contained (NOT a `-f base -f prod` override).
#
# Differences from docker-compose.yml (the dev stack):
#   - frontend is a STATIC build (frontend/Dockerfile), not the Vite dev server:
#     no HMR, no Host allow-list, minified; the API URL is BAKED at build time
#     from VITE_API_BASE_URL, so there is no runtime .env to read.
#   - backend runs the image's default CMD (uvicorn, no --reload) with no source
#     bind-mount, and takes SUPABASE_URL etc. straight from .env (no local
#     host.docker.internal override).
#
# Usage (from the project root, with a populated .env):
#   docker compose -f docker-compose.prod.yml up -d --build
#   # rebuild after changing VITE_API_BASE_URL (it is compiled in):
#   docker compose -f docker-compose.prod.yml up -d --build frontend
#
# Required in the project-root .env:
#   VITE_API_BASE_URL   REQUIRED — public backend URL the BROWSER calls, e.g.
#                       https://api.madhats.getaiconsult.com.au   (baked at build).
#                       Enforced with `${VITE_API_BASE_URL:?...}` on the frontend
#                       build args below: an unset value would otherwise compile
#                       localhost into the production bundle.
#   VITE_STORE_KEY      e.g. mh_pk_madhats_local
#   ALLOWED_ORIGINS     backend CORS. Defaults to "*" (any origin, reflected —
#                       kept open for now). Set a comma-separated list to lock
#                       down; it MUST then include the frontend origin, e.g.
#                       https://madhats.getaiconsult.com.au
#   ACME_EMAIL          NO LONGER USED. The host nginx terminates TLS as of
#                       2026-07-29, so Caddy issues no certificates and the
#                       `email` directive is gone from Caddyfile.prod. Leaving a
#                       stale value in .env is harmless; nothing reads it.
#
# NOTE: the backend here runs the BUILT image (no source bind-mount), so a CORS
# *code* change needs a rebuild, not just recreate:
#   docker compose -f docker-compose.prod.yml up -d --build backend
#   SUPABASE_URL / keys / ADMIN_SECRET / provider keys …  (as usual)
#
#   - caddy is the only service publishing ports. backend/frontend are reachable
#     only on the compose network. Re-adding a `ports:` mapping to either one
#     re-exposes that service in cleartext; on `backend` it additionally makes
#     TRUSTED_PROXY_HOSTS=* spoofable, which is a rate-limit bypass. (`frontend`
#     sets no TRUSTED_PROXY_HOSTS — it is a static file server.)
#   - VITE_API_BASE_URL is COMPILED IN. After changing it you must REBUILD, not
#     just recreate:  docker compose -f docker-compose.prod.yml up -d --build frontend
#     Recreating alone leaves the old http:// URL in the bundle, and every API
#     call then fails as mixed content from the HTTPS page.

services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      # Safe ONLY because this service publishes no ports (see above): no
      # external caller can reach 8000 — only containers on this compose
      # network can, and Caddy overwrites X-Forwarded-For on the way through.
      # (Note `watchdog` also calls backend:8000 directly; it sends no
      # X-Forwarded-For, so it is unaffected. The boundary is "nothing off this
      # network", not "only Caddy".)
      # Re-add a `ports:` mapping and this line becomes a rate-limit bypass —
      # a direct caller could rotate the header for a fresh bucket per request.
      TRUSTED_PROXY_HOSTS: "*"
    env_file: .env
    # host.docker.internal is available if SUPABASE_URL points at a Supabase
    # running on the host; harmless when SUPABASE_URL is a hosted URL.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # No --reload, no source bind-mount: run the built image's code and CMD.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile          # production static build
      args:
        # Compiled into the JS bundle at build time (Vite inlines VITE_*).
        #
        # `:?` makes compose refuse to build with this message rather than
        # falling back silently. A silent default here is the single most
        # consequential one in the file. If .env is missing or mistypes the
        # key, a `:-` fallback builds cleanly, certs issue, and the production
        # bundle calls http://localhost:8000: a total outage that presents as a
        # backend fault. Refusing to build is the cheaper failure.
        #
        # NB this catches an UNSET value only. A STALE one (an old host still
        # sitting in .env) builds happily — the bundle-inspection step in the
        # cutover runbook is what catches that.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL in .env - it is COMPILED INTO the frontend bundle at build time, e.g. https://api.madhats.getaiconsult.com.au}
        VITE_STORE_KEY: ${VITE_STORE_KEY:-}
    restart: unless-stopped
    env_file: .env                   # static server (serve -s) listens on 5173
    depends_on:
      - backend

  # Hostname routing for both web services. The ONLY container publishing ports.
  #
  # NOT the TLS terminator any more (changed 2026-07-29): the host's existing
  # nginx owns :80/:443 and terminates TLS, then proxies to 127.0.0.1:8480 here.
  # Caddy therefore issues no certificates and needs no ACME_EMAIL.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      # 8480, NOT the conventional 8080: on the production box 8080 was already
      # taken (docker refused to start — "failed to bind host port
      # 127.0.0.1:8080: address already in use"), which is normal on a host
      # whose nginx already reverse-proxies something. The number is arbitrary
      # and internal — it only has to match `proxy_pass` in the nginx vhost
      # (nginx/madhats.conf.example). Change both together or nginx 502s.
      #
      # LOOPBACK-BOUND ON PURPOSE. Only the host's nginx should reach this; the
      # 127.0.0.1 prefix keeps the plain-HTTP hop off the public interface.
      # Dropping the prefix ("8480:80") would publish an unencrypted copy of the
      # whole site — and, because the backend runs TRUSTED_PROXY_HOSTS=*, would
      # also let a direct caller spoof X-Forwarded-For for a fresh rate-limit
      # bucket per request, exactly as the backend `ports:` warning above says.
      - "127.0.0.1:8480:80"
      # These two stay PUBLIC: they are redirect-only, nginx does not own them,
      # and already-delivered customer email links point at them.
      - "8000:8000" # legacy redirect only — see Caddyfile.prod, remove after 30d
      - "5173:5173" # legacy redirect only — see Caddyfile.prod, remove after 30d
    environment:
      # The hostnames Caddy routes on. NOT optional and NOT defaulted: Caddy
      # matches by hostname, and a wrong value does NOT 404 (verified): Caddy
      # returns HTTP 200 with an EMPTY BODY, so you get blank pages while nginx
      # looks perfectly healthy — a failure that reads as "nginx isn't
      # forwarding to docker" and sends you debugging the wrong layer.
      #
      # These MUST EXACTLY match the `server_name` in the nginx vhost AND the
      # host part of VITE_API_BASE_URL / EMAIL_VERIFY_BASE_URL / STUDIO_BASE_URL.
      # VITE_API_BASE_URL is compiled into the bundle, so changing hostnames
      # means REBUILDING the frontend, not just recreating it.
      #
      #   staging: mhstaging.getaiconsult.com.au / api.mhstaging.getaiconsult.com.au
      #   prod:    madhats.getaiconsult.com.au   / api.madhats.getaiconsult.com.au
      STUDIO_HOST: ${STUDIO_HOST:?set STUDIO_HOST in .env - the studio hostname Caddy routes on, e.g. mhstaging.getaiconsult.com.au. It must match the nginx server_name exactly}
      API_HOST: ${API_HOST:?set API_HOST in .env - the backend hostname Caddy routes on, e.g. api.mhstaging.getaiconsult.com.au. It must match the nginx server_name exactly}
    volumes:
      - ./caddy/Caddyfile.prod:/etc/caddy/Caddyfile:ro
      # Retained. No longer holds Let's Encrypt certificates (nginx owns TLS
      # now), but Caddy still keeps state here. Removing it is a separate,
      # deliberate change — keep it if TLS is ever moved back into Caddy.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  # Periodically triggers the generation watchdog (reap stalled renders) and the
  # delivery backfill (retry undelivered previews) — both are admin self-heal
  # endpoints that need an external scheduler. A tiny curl-loop container reaches
  # the backend over the compose network. $${ADMIN_SECRET} is a literal `$` +
  # ${ADMIN_SECRET} so the SHELL expands it at runtime from .env (not compose).
  watchdog:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    entrypoint:
      - /bin/sh
      - -c
      - >
        while true; do
        curl -fsS -X POST -H "X-Admin-Secret: $${ADMIN_SECRET}"
        http://backend:8000/admin/generations/reap-stuck > /dev/null 2>&1 || true;
        curl -fsS -X POST -H "X-Admin-Secret: $${ADMIN_SECRET}"
        http://backend:8000/admin/deliveries/backfill > /dev/null 2>&1 || true;
        sleep 180;
        done

  # Catalogue FETCH arm — this container does the Shopify request, because the
  # backend's HTTP client is refused by Shopify's edge from a hosting ASN while
  # this image's curl is not (same droplet, same IP; measured 2026-07-29 —
  # backend burst 6x429, this image burst 6x200). See scripts/catalogue-sync.sh
  # and app/services/catalogue_ingest.py for the full measurements.
  #
  # It carries no schedule: no tzdata in this image, so it cannot know when
  # midnight Sydney is. The backend decides who is due; this polls and fetches.
  #
  # The image's ENTRYPOINT is curl itself, hence the explicit override.
  catalogue-sync:
    image: curlimages/curl:8.11.1
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    volumes:
      - ./scripts/catalogue-sync.sh:/usr/local/bin/catalogue-sync.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/catalogue-sync.sh"]

volumes:
  caddy_data:
  caddy_config:
